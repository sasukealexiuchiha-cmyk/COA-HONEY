<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Phishing o legítimo? Test de detección</title>
<style>
  :root{
    --bg:#eef2f6; --surface:#ffffff; --ink:#1b2a38; --muted:#5b6b7b;
    --line:#d3dbe4; --accent:#1f5f8b; --ok:#1d7a4a; --bad:#b3261e;
    --ok-bg:#e6f4ec; --bad-bg:#fbeae9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121a22; --surface:#1b2631; --ink:#e7edf3; --muted:#9aabbb;
      --line:#2e3c4a; --accent:#6bb3e0; --ok:#5cc58b; --bad:#ff8a80;
      --ok-bg:#16342500; --bad-bg:#3a1b1a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
  main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:1.6rem;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .count{font-size:.85rem;color:var(--muted);margin-bottom:16px}

  .mail{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .mail-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:.92rem}
  .mail-head div{margin:2px 0}
  .mail-head b{display:inline-block;width:70px;color:var(--muted);font-weight:500}
  .mail-head .subject{font-size:1.05rem;font-weight:600;margin-bottom:8px}
  .mail-body{padding:18px;font-size:.96rem}
  .mail-body p{margin:0 0 12px}
  .btn-fake{display:inline-block;padding:9px 18px;background:var(--accent);color:#fff;
    border-radius:4px;text-decoration:none;cursor:pointer;border:0;font:inherit}
  .hint{font-size:.8rem;color:var(--muted);margin-top:6px}
  #linkbar{position:sticky;bottom:0;margin-top:10px;font-size:.82rem;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:32px}

  .choices{display:flex;gap:12px;margin:18px 0}
  .choices button{flex:1;padding:14px;font:inherit;font-weight:600;border-radius:6px;
    border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
  .choices button:hover:not(:disabled){border-color:var(--accent)}
  .choices button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .choices button:disabled{cursor:default;opacity:.7}

  .feedback{border-radius:8px;padding:16px 18px;margin-bottom:16px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--ok-bg);border:1px solid var(--ok)}
  .feedback.bad{background:var(--bad-bg);border:1px solid var(--bad)}
  .feedback h2{margin:0 0 6px;font-size:1.05rem}
  .feedback ul{margin:8px 0 0;padding-left:20px}
  .next{padding:11px 22px;font:inherit;font-weight:600;background:var(--accent);color:#fff;
    border:0;border-radius:6px;cursor:pointer}
  .next:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .result{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;text-align:center}
  .result .score{font-size:2.6rem;font-weight:700;margin:6px 0}
  .review{text-align:left;margin-top:20px}
  .review li{margin:6px 0}
  .tag-ok{color:var(--ok);font-weight:600}.tag-bad{color:var(--bad);font-weight:600}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>¿Phishing o legítimo?</h1>
  <p class="sub">Revisa cada mensaje y decide. Pasa el cursor sobre los enlaces para ver su destino real.</p>

  <div id="quiz">
    <div class="bar"><i id="progress"></i></div>
    <div class="count" id="count"></div>

    <article class="mail" aria-live="polite">
      <div class="mail-head">
        <div class="subject" id="m-subject"></div>
        <div><b>De:</b> <span id="m-from"></span></div>
        <div><b>Para:</b> <span id="m-to"></span></div>
      </div>
      <div class="mail-body" id="m-body"></div>
    </article>
    <div id="linkbar" aria-live="polite">Pasa el cursor sobre un enlace o botón para ver su destino.</div>

    <div class="choices">
      <button id="btn-phish">Es phishing</button>
      <button id="btn-legit">Es legítimo</button>
    </div>

    <div class="feedback" id="feedback" role="status"></div>
    <button class="next" id="next" hidden>Siguiente</button>
  </div>

  <div class="result" id="result" hidden></div>
</main>

<script>
/* ---------- Banco de preguntas (editable) ----------
   body: HTML del correo. Usa data-url en <a> para mostrar el destino real.
   phishing: true/false. clues: pistas que explican la respuesta. */
const QUESTIONS = [
  {
    subject: "Tu cuenta será suspendida en 24 horas",
    from: "Soporte <soporte@micuenta-seguridad.co>",
    to: "tú@correo.com",
    body: `<p>Estimado cliente:</p>
      <p>Detectamos actividad inusual. Si no verifica su identidad hoy, su cuenta será cancelada de forma permanente.</p>
      <p><a class="btn-fake" data-url="http://micuenta-seguridad.co/verificar?id=88213">Verificar ahora</a></p>
      <p class="hint">Equipo de Seguridad</p>`,
    phishing: true,
    clues: [
      "Crea urgencia y amenaza con consecuencias inmediatas.",
      "Saludo genérico («Estimado cliente») en lugar de tu nombre.",
      "El dominio del remitente no pertenece a ninguna empresa conocida y el enlace usa http sin cifrado."
    ]
  },
  {
    subject: "Tu recibo de suscripción – octubre",
    from: "Facturación <facturas@miservicio.com>",
    to: "ana.lopez@correo.com",
    body: `<p>Hola Ana:</p>
      <p>Adjuntamos el recibo de tu suscripción de octubre por $9.99. No necesitas hacer nada; el cobro se hizo automáticamente a tu tarjeta terminada en 4821.</p>
      <p>Puedes ver tu historial entrando por ti mismo a <b>miservicio.com</b> desde tu navegador.</p>
      <p class="hint">Si no reconoces este cobro, responde a este correo o contacta soporte desde la app.</p>`,
    phishing: false,
    clues: [
      "Te llama por tu nombre y da detalles verificables (monto, últimos 4 dígitos).",
      "No te pide datos ni urge a hacer clic: te invita a entrar por tu cuenta.",
      "No contiene enlaces sospechosos ni archivos ejecutables."
    ]
  },
  {
    subject: "Factura pendiente – abrir archivo adjunto",
    from: "Contabilidad <contabilidad@proveedor-pagos.net>",
    to: "tú@correo.com",
    body: `<p>Buenos días,</p>
      <p>Adjunto la factura vencida. Por favor ábrala y habilite el contenido para visualizarla correctamente.</p>
      <p><a data-url="archivo local: Factura_8841.pdf.exe">📎 Factura_8841.pdf.exe</a></p>`,
    phishing: true,
    clues: [
      "La extensión real es .exe: es un programa, no un PDF.",
      "Pide «habilitar contenido», técnica típica para ejecutar código malicioso.",
      "No esperabas esa factura ni conoces al remitente."
    ]
  },
  {
    subject: "Código de verificación para iniciar sesión",
    from: "Seguridad <no-reply@accounts.miplataforma.com>",
    to: "tú@correo.com",
    body: `<p>Tu código de verificación es <b>482 193</b>.</p>
      <p>Caduca en 10 minutos. Si acabas de intentar iniciar sesión, introduce el código en la pantalla donde lo solicitaste.</p>
      <p class="hint">Si no fuiste tú, ignora este mensaje y cambia tu contraseña desde la app oficial. Nunca compartiremos este código por teléfono ni chat.</p>`,
    phishing: false,
    clues: [
      "Coincide con una acción que acabas de realizar.",
      "No incluye enlaces: el código se usa donde tú iniciaste el proceso.",
      "Advierte no compartir el código con nadie."
    ]
  },
  {
    subject: "¡Ganaste un premio! Reclámalo antes de medianoche",
    from: "Premios <promos@sorteo-global-ganador.xyz>",
    to: "tú@correo.com",
    body: `<p>¡Felicidades! Fuiste seleccionado entre millones de usuarios para recibir un smartphone gratis.</p>
      <p>Solo paga el envío de $3.50 con tu tarjeta para recibirlo.</p>
      <p><a class="btn-fake" data-url="https://sorteo-global-ganador.xyz/pago">Reclamar mi premio</a></p>`,
    phishing: true,
    clues: [
      "Premio de un sorteo en el que nunca participaste.",
      "Te pide datos de tarjeta para un supuesto «envío gratuito».",
      "Dominio .xyz sin relación con ninguna marca real y fecha límite artificial."
    ]
  },
  {
    subject: "Aviso: cambio de contraseña solicitado",
    from: "Seguridad <seguridad@tu-banco-online.com>",
    to: "tú@correo.com",
    body: `<p>Hola:</p>
      <p>Alguien solicitó cambiar tu contraseña. Si fuiste tú, haz clic abajo en las próximas 2 horas.</p>
      <p><a class="btn-fake" data-url="https://tu-banco-online.com.verificacion-segura.info/reset">Cambiar contraseña</a></p>
      <p class="hint">Si no fuiste tú, ignora este correo.</p>`,
    phishing: true,
    clues: [
      "El dominio real del enlace es verificacion-segura.info; «tu-banco-online.com» es solo un subdominio engañoso.",
      "Lee el dominio de derecha a izquierda hasta la primera barra: ahí está el verdadero destino.",
      "Aunque el texto parezca razonable, el enlace lleva a un sitio ajeno al banco."
    ]
  },
  {
    subject: "Reunión de equipo movida a las 3 p. m.",
    from: "Carlos Méndez <carlos.mendez@tuempresa.com>",
    to: "equipo@tuempresa.com",
    body: `<p>Hola equipo:</p>
      <p>Movemos la reunión semanal de hoy a las 3 p. m. por conflicto de agenda. La sala sigue siendo la misma y el calendario ya está actualizado.</p>
      <p>Saludos,<br>Carlos</p>`,
    phishing: false,
    clues: [
      "Remitente del dominio de tu propia empresa y tema cotidiano.",
      "No pide datos, dinero ni hacer clic en nada.",
      "Menciona el calendario compartido, que puedes verificar por tu cuenta."
    ]
  },
  {
    subject: "Urgente: transferencia necesaria hoy",
    from: "Director General <director.general@tuempresa-corp.com>",
    to: "tú@tuempresa.com",
    body: `<p>Necesito que hagas una transferencia confidencial hoy mismo. Estoy en una reunión y no puedo hablar por teléfono.</p>
      <p>Responde en cuanto leas esto y te envío los datos de la cuenta. No lo comentes con nadie.</p>`,
    phishing: true,
    clues: [
      "Suplantación de un directivo con un dominio casi idéntico al real (tuempresa-corp.com).",
      "Pide secreto y rapidez, y evita cualquier verificación por otro canal.",
      "Las solicitudes de dinero inesperadas siempre se confirman por teléfono o en persona."
    ]
  }
];

/* ---------- Lógica ---------- */
const $ = id => document.getElementById(id);
let order, idx, answers;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(){
  order = shuffle(QUESTIONS);
  idx = 0; answers = [];
  $("result").hidden = true; $("quiz").hidden = false;
  show();
}

function show(){
  const q = order[idx];
  $("m-subject").textContent = q.subject;
  $("m-from").textContent = q.from;
  $("m-to").textContent = q.to;
  $("m-body").innerHTML = q.body;
  $("count").textContent = `Mensaje ${idx+1} de ${order.length}`;
  $("progress").style.width = (idx/order.length*100) + "%";
  $("feedback").className = "feedback"; $("feedback").innerHTML = "";
  $("next").hidden = true;
  $("btn-phish").disabled = $("btn-legit").disabled = false;
  $("linkbar").textContent = "Pasa el cursor sobre un enlace o botón para ver su destino.";
  // Enlaces: mostrar destino real, nunca navegar
  $("m-body").querySelectorAll("[data-url]").forEach(a=>{
    a.tabIndex = 0;
    const showUrl = () => $("linkbar").textContent = "Destino: " + a.dataset.url;
    a.addEventListener("mouseenter", showUrl);
    a.addEventListener("focus", showUrl);
    a.addEventListener("click", e => e.preventDefault());
  });
}

function answer(saysPhishing){
  const q = order[idx];
  const correct = saysPhishing === q.phishing;
  answers.push({q, correct});
  $("btn-phish").disabled = $("btn-legit").disabled = true;
  const fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "bad");
  fb.innerHTML = `<h2>${correct ? "Correcto" : "Incorrecto"}: este mensaje ${q.phishing ? "es phishing" : "es legítimo"}.</h2>
    <ul>${q.clues.map(c=>`<li>${c}</li>`).join("")}</ul>`;
  const nx = $("next");
  nx.hidden = false;
  nx.textContent = idx === order.length-1 ? "Ver resultados" : "Siguiente";
  nx.focus();
}

function next(){
  idx++;
  if(idx >= order.length) return finish();
  show();
}

function finish(){
  $("quiz").hidden = true;
  const score = answers.filter(a=>a.correct).length;
  const pct = Math.round(score/answers.length*100);
  const msg = pct===100 ? "Excelente ojo. Sigue verificando antes de hacer clic."
            : pct>=60  ? "Buen resultado. Repasa los casos fallados."
                       : "Hay margen de mejora: revisa las pistas de cada caso.";
  const r = $("result");
  r.hidden = false;
  r.innerHTML = `<h2>Resultado</h2>
    <div class="score">${score} / ${answers.length}</div>
    <p>${msg}</p>
    <div class="review"><ul>${answers.map(a =>
      `<li><span class="${a.correct?'tag-ok':'tag-bad'}">${a.correct?'✔':'✘'}</span> ${a.q.subject}
       — ${a.q.phishing?'phishing':'legítimo'}</li>`).join("")}</ul></div>
    <button class="next" id="again">Intentar de nuevo</button>`;
  $("again").addEventListener("click", start);
  $("again").focus();
}

$("btn-phish").addEventListener("click", ()=>answer(true));
$("btn-legit").addEventListener("click", ()=>answer(false));
$("next").addEventListener("click", next);
start();
</script>
</body>
</html>
